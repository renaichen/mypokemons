<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Education – Mike’s Space</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../style.css">
</head>

<body class="bg-slate-50 text-gray-800 font-sans leading-relaxed">
  <header class="max-w-3xl mx-auto px-4 py-10">
    <h1 class="text-3xl sm:text-4xl font-semibold text-gray-900">Education</h1>
    <nav class="mt-4 text-gray-600 text-sm sm:text-base">
      <a href="../" class="hover:text-gray-900">← Back to Home</a>
    </nav>
  </header>

  <main class="max-w-3xl mx-auto px-4 mt-10 content">

    <section>
      <p class="text-gray-500">
        Learning progress, ideas, and direction for the kids.
      </p>
    </section>

    <div class="divider"></div>

    <section class="space-y-6">

      <!-- Johnny -->
      <div class="rounded-xl bg-white p-5 shadow-sm">
        <h2 class="text-xl font-semibold text-gray-900">Johnny</h2>

        <div class="mt-4 space-y-3">
          <details class="border border-gray-100 p-4 rounded-lg">
            <summary class="cursor-pointer font-medium">Reading</summary>
            <div class="mt-3 text-sm text-gray-700">
              Strong reading habit; expand genre diversity.
            </div>
          </details>
        </div>
      </div>

      <!-- Jimmy -->
      <div class="rounded-xl bg-white p-5 shadow-sm">
        <h2 class="text-xl font-semibold text-gray-900">Jimmy</h2>

        <div class="mt-4 space-y-3">
          <details class="border border-gray-100 p-4 rounded-lg">
            <summary class="cursor-pointer font-medium">Projects</summary>
            <div class="mt-3 text-sm text-gray-700">
              Website building with dad (learning by doing).
            </div>
          </details>
        </div>
      </div>

      <!-- Teddy -->
      <div class="rounded-xl bg-white p-5 shadow-sm">
        <h2 class="text-xl font-semibold text-gray-900">Teddy</h2>

        <div class="mt-4 space-y-3">
          <details class="border border-gray-100 p-4 rounded-lg">
            <summary class="cursor-pointer font-medium">Early Learning</summary>
            <div class="mt-3 text-sm text-gray-700">
              Vocabulary, play-based learning.
            </div>
          </details>
        </div>
      </div>

    </section>

  </main>

  <footer class="text-center text-gray-400 text-sm px-4 py-10">
    © 2025 Mike Shin
  </footer>
</body>
</html>
